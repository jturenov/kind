<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafka Peek</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📨 Kafka Peek</h1>
            <p>Send and view Kafka messages</p>
        </header>

        <section class="send-section">
            <h2>Send Message</h2>
            <form id="sendForm">
                <div class="form-group">
                    <label for="messageInput">Message:</label>
                    <input
                        type="text"
                        id="messageInput"
                        placeholder="Enter your message"
                        required
                    >
                </div>
                <button type="submit" class="btn btn-primary">Send to Kafka</button>
            </form>
            <div id="sendStatus" class="status"></div>
        </section>

        <section class="messages-section">
            <h2>Messages in Topic</h2>
            <button id="refreshBtn" class="btn btn-secondary">Refresh Messages</button>
            <div id="messagesContainer" class="messages-list">
                <p class="empty-state">Click "Refresh Messages" to view messages</p>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
