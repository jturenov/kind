services:
  kafka:
    image: quay.io/strimzi/kafka:latest-kafka-3.8.0
    command:
      - sh
      - -c
      - "bin/kafka-storage.sh format -t $(bin/kafka-storage.sh random-uuid) -c config/kraft/server.properties && bin/kafka-server-start.sh config/kraft/server.properties --override advertised.listeners=PLAINTEXT://kafka:9092"
    environment:
      LOG_DIR: /tmp/logs

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      KAFKA_BROKER: kafka:9092
    depends_on:
      - kafka

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend